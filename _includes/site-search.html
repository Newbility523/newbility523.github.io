<div class="site-search" role="search" data-site-search data-index-url="{{ site.baseurl }}/search.json">
  <div class="site-search-box">
    <span class="site-search-icon" aria-hidden="true"></span>
    <input
      id="site-search-input"
      class="site-search-input"
      type="search"
      placeholder="search"
      autocomplete="off"
      aria-label="Search posts"
      aria-controls="site-search-results"
      aria-expanded="false"
    >
    <button class="site-search-cancel" type="button" hidden>Cancel</button>
  </div>
  <div id="site-search-results" class="site-search-results" aria-live="polite" hidden></div>
</div>
